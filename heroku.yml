# Heroku builds and runs the app from Dockerfile.heroku (the "container" stack).
# Set up once: docs/operations.md, "Heroku". Heroku deploys the GitHub branch Prod automatically
# once CI passes: it builds, migrates the database in the release phase, and starts the new release.

setup:
  addons:
    - plan: heroku-postgresql
      as: DATABASE

build:
  docker:
    web: Dockerfile.heroku

release:
  image: web
  command:
    - /app/deploy/heroku/release.sh

run:
  web:
    command:
      - /app/deploy/heroku/start.sh
