[project]
name = "auib-advisor-api"
version = "0.1.0"
description = "API and planning engine for the AUIB Academic Advisor"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.142,<0.143",
  "uvicorn[standard]>=0.37",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "networkx>=3.5",
  "cryptography>=46",  # AES-256-GCM for encrypted admin backups
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "httpx2>=2.13",
  "ruff>=0.13",
  "mypy>=1.18",
  "pip-audit>=2.9",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = [
  "S101",  # assert is fine in tests
  "RUF001", "RUF002", "RUF003",  # SIS text legitimately contains look-alike characters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501", "PT018"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
