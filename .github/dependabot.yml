version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    groups:
      # pydantic pins an exact pydantic-core, so they must move together or the install fails.
      pydantic:
        patterns: ["pydantic", "pydantic-core", "pydantic_core", "pydantic-settings"]
      # One pull request a week for the small updates, instead of one per package.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      next-and-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next"]
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directories: ["/api", "/web"]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
