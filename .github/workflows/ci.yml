name: CI

on:
  push:
    # Prod is what Heroku deploys, once these checks pass (docs/operations.md, "Heroku").
    branches: [main, Prod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advisor_test
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      POSTGRES_URL: postgresql+psycopg://advisor:advisor@localhost:5432/advisor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type check (strict)
        run: mypy app
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
        env:
          ADVISOR_DATABASE_URL: ${{ env.POSTGRES_URL }}
      # The repository is public, but course and program data are for signed-in AUIB students only:
      # they are committed sealed (ADR 0008), and CI on GitHub never opens them: the data key is not given
      # to GitHub. Tests that need the data skip themselves here and run on a maintainer's computer.
      - name: No plain course data is committed
        working-directory: .
        run: test -z "$(git ls-files data/catalog data/programs scripts/curricula)"
      # Every test once: the API tests on PostgreSQL, as in production (developers run them on SQLite).
      - name: Tests, with coverage (those needing the course data are skipped)
        run: pytest --cov=app --cov-report=term-missing
        env:
          ADVISOR_TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
      - name: OpenAPI schema used by the web app is up to date
        run: |
          python -m app.cli export-openapi /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  web:
    name: Web (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts
      - run: npm run build
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Docker stack, Playwright, accessibility)
    needs: [api, web]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ADVISOR_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      ADVISOR_AUTO_IMPORT_ACCEPT_WARNINGS: "true"
      HTTP_PORT: "8080"
      # No mail server in CI: sign-in codes go to the log, and the tests sign in with issued sessions.
      ADVISOR_ENVIRONMENT: test
      ADVISOR_MAIL_MODE: log
      # The tests plan many times in a row from one address.
      ADVISOR_RATE_LIMIT_PER_MINUTE: "600"
      # No data key: the stack starts with an empty catalog, and the browser tests that plan skip
      # themselves (ADR 0008).
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait
      - name: Sessions for the test students (F9.1)
        run: |
          issue() { docker compose exec -T api python -m app.cli issue-session e2e@auib.edu.iq; }
          echo "E2E_SESSION_TOKEN=$(issue)" >> "$GITHUB_ENV"
          echo "E2E_SIGN_OUT_TOKEN=$(issue)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_TOKEN: ${{ env.ADVISOR_ADMIN_TOKEN }}
      # No report or screenshots are uploaded: on a public repository anyone could download them, and
      # they show course data (ADR 0008). Run the tests locally to see a failure's screenshots.
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  heroku:
    name: Heroku image (build, release phase, smoke test)
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advisor
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      # As Heroku Postgres sets it; CI's database has no TLS, so the address says so.
      DATABASE_URL: postgres://advisor:ci-only-password@localhost:5432/advisor?sslmode=disable
      ADVISOR_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      ADVISOR_AUTO_IMPORT_ACCEPT_WARNINGS: "true"
      # No mail server in CI; the smoke test signs in with an issued session.
      ADVISOR_ENVIRONMENT: test
      ADVISOR_MAIL_MODE: log
      # No data key: the release phase skips the import, as on a server without the key (ADR 0008).
    steps:
      - uses: actions/checkout@v4
      - name: Build Dockerfile.heroku
        run: docker build -f Dockerfile.heroku -t advisor-heroku .
      # Heroku does not run containers as root, nor as the image's own user, so neither does CI.
      - name: Release phase (migrations and import)
        run: >-
          docker run --rm --network host --user 4242:4242
          -e DATABASE_URL -e ADVISOR_ADMIN_TOKEN -e ADVISOR_AUTO_IMPORT_ACCEPT_WARNINGS
          -e ADVISOR_ENVIRONMENT -e ADVISOR_MAIL_MODE
          advisor-heroku /app/deploy/heroku/release.sh
      - name: Start the web dyno
        run: >-
          docker run -d --name dyno --network host --user 4242:4242 -e PORT=8080
          -e DATABASE_URL -e ADVISOR_ADMIN_TOKEN -e ADVISOR_ENVIRONMENT -e ADVISOR_MAIL_MODE advisor-heroku
      - name: Smoke test
        run: |
          for attempt in $(seq 1 60); do curl -fsS http://localhost:8080/api/ready && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:8080/
          # Course data needs a signed-in AUIB student (F9.1).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/programs)" = 401
          token="$(docker run --rm --network host --user 4242:4242 -e DATABASE_URL -e ADVISOR_ENVIRONMENT \
            -e ADVISOR_MAIL_MODE advisor-heroku python -m app.cli issue-session ci@auib.edu.iq)"
          # With a session the request gets through; the catalog is empty here, so the program is unknown.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/api/v1/planner/plan \
            -H "Cookie: advisor_session=$token" \
            -H "Content-Type: application/json" -d '{"program_id": "casc-computer-science"}')" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: advisor_session=$token" \
            http://localhost:8080/api/v1/programs)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: http' http://localhost:8080/)" = 308
      - name: Dyno logs
        if: always()
        run: docker logs dyno
