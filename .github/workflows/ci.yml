name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: advisor_test
          POSTGRES_USER: advisor
          POSTGRES_PASSWORD: advisor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U advisor -d advisor_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      POSTGRES_URL: postgresql+psycopg://advisor:advisor@localhost:5432/advisor_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check app tests migrations
          ruff format --check app tests migrations
      - name: Type check (strict)
        run: mypy app
      - name: Migrations apply cleanly and match the models
        run: alembic upgrade head && alembic check
        env:
          ADVISOR_DATABASE_URL: ${{ env.POSTGRES_URL }}
      - name: Tests on SQLite, with coverage
        run: pytest --cov=app --cov-report=term-missing
      - name: API tests on PostgreSQL
        run: pytest tests/api
        env:
          ADVISOR_TEST_DATABASE_URL: ${{ env.POSTGRES_URL }}
      - name: Program packages pass validation
        run: python -m app.cli validate ../data/programs/*/
      - name: OpenAPI schema used by the web app is up to date
        run: |
          python -m app.cli export-openapi /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  web:
    name: Web (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API types match the OpenAPI schema
        run: |
          npm run gen:api
          git diff --exit-code src/lib/api-types.ts
      - run: npm run build
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Docker stack, Playwright, accessibility)
    needs: [api, web]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      ADVISOR_ADMIN_TOKEN: ci-only-admin-token-0123456789abcdef
      ADVISOR_AUTO_IMPORT_ACCEPT_WARNINGS: "true"
      HTTP_PORT: "8080"
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the whole stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: web
        run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_TOKEN: ${{ env.ADVISOR_ADMIN_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/e2e/.report
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
